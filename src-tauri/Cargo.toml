[package]
name = "ai-usage"
version = "0.1.0"
description = "ChatGPT Codex usage in the macOS menu bar"
authors = ["AI Usage"]
edition = "2021"

[lib]
name = "ai_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
